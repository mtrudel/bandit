name: Run autobahn

on:
  workflow_call:
    inputs:
      elixirs:
        type: string
        default: "[\"1.18.x\"]"
      erlangs:
        type: string
        default: "[\"27.x\"]"

env:
  MIX_ENV: test

jobs:
  autobahn:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        elixir: ${{ fromJSON(inputs.elixirs) }}
        otp: ${{ fromJSON(inputs.erlangs) }}
        case:
          - "1.*,2.*,3.*,4.*,5.*,6.1.1,6.1.3,6.2.*,6.3.*,6.4.*,7.*,8.*,10.*"
          - "9.1.*"
          - "9.2.*"
          - "9.3.*"
          - "12.1.*"
          - "12.2.*"
          - "12.3.*"
          - "12.4.*"
          - "12.5.*"
          - "13.1.*"
          - "13.2.*"
          - "13.3.*"
          - "13.4.*"
          - "13.5.*"
          - "13.6.*"
          - "13.7.*"
    env:
      AUTOBAHN_CASES: ${{ matrix.case }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}
    - name: Disable compile warnings
      run: echo "::remove-matcher owner=elixir-mixCompileWarning::"
    - name: Retrieve mix dependencies cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: mix-cache
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-
    - name: Install mix dependencies
      if: steps.mix-cache.outputs.cache-hit != 'true'
      run: |
        mix deps.get
    - name: Run Autobahn test
      run: mix test --only slow test/bandit/websocket/autobahn_test.exs
