name: Elixir CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    uses: mtrudel/elixir-ci-actions/.github/workflows/test.yml@002e9c2b6135f1f5a86edeb4ee9bf14707390830 # main
    permissions:
      contents: read
  lint:
    uses: mtrudel/elixir-ci-actions/.github/workflows/lint.yml@002e9c2b6135f1f5a86edeb4ee9bf14707390830 # main
    permissions:
      actions: write
  h2spec:
    permissions:
      contents: read
    uses: ./.github/workflows/h2spec.yml
  autobahn:
    permissions:
      contents: read
    uses: ./.github/workflows/autobahn.yml
  re-run:
    permissions:
      actions: write
    needs: [test, lint, h2spec, autobahn]
    if: failure() && fromJSON(github.run_attempt) < 5
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rerun.yml -F run_id=${{ github.run_id }}
